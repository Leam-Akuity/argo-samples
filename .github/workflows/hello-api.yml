name: Build hello-api image

on:
  push:
    branches: [main]
    paths: ['rest-api/**']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GUTHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./hello-api
          push: true
          tags: ghcr.io/leam-akuity/argo-samples:latest
