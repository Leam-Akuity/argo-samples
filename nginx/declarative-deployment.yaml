kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-declarative
  annotations:
    environment: test
    organization: marketing
spec:
  project: default
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
